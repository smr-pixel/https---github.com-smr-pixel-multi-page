<!DOCTYPE html>
<html lang="en">
<head>
<style>
body {
  background-image: url('sky.avif');
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  background-attachment: fixed;
}
.butterfly {
  position: fixed;
  top: 35%;
  left: 0;
  width: clamp(80px, 12vw, 160px);
  animation: wanderpulse 12s ease-in-out infinite;
}

@keyframes wanderpulse {
  0% { transform: translate(0, 20px) rotate(-8deg) scale(0.95); }
  50% { transform: translate(70vw, -50px) rotate(8deg) scale(1.05); }
  100% { transform: translate(0, 20px) rotate(-8deg) scale(0.95); }
}
</style>
</head>

<body>
<img class="butterfly" src="butterfly.webp" alt="">
